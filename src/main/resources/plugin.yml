name: DisableDamagePlugin
main: com.example.disabledamage.DisableDamagePlugin
version: 1.0
description: Plugin to disable damage from TNT and respawn anchors with toggle commands
api-version: 1.20
commands:
  disabledamage:
    description: Toggle damage protection settings
    usage: /<command> <tnt|anchor|on|off> <on|off>
    permission: disabledamage.use
permissions:
  disabledamage.use:
    description: Allows the player to use /disabledamage command
    default: op
